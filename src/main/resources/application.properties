spring.application.name=PaymentService

# ===============================
# SERVER CONFIG
# ===============================
server.port=${PORT:8085}

# ===============================
# EUREKA CLIENT CONFIG
# ===============================
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.register-with-eureka=${EUREKA_REGISTER:true}
eureka.client.fetch-registry=${EUREKA_FETCH:true}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

# ===============================
# MONGODB CONFIG
# ===============================
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/Paymentcollection}
spring.data.mongodb.auto-index-creation=false

# ===============================
# JWT CONFIG
# ===============================
app.jwt.secret=${JWT_SECRET:ReplaceWithA256BitSecretKeyForProductionUseOnly123456}

# ===============================
# ACTUATOR (OPTIONAL)
# ===============================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework=INFO
logging.level.com.kce=DEBUG